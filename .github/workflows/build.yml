# 三端构建：Windows（便携版 + 安装版）、macOS（通用 dmg / zip）、Linux（AppImage / deb / tar.gz）
# 触发：在 Actions 页面手动运行，或推送 v 开头的标签（如 v1.0.1，会同时自动创建 GitHub Release）
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 版本号跟随标签
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: 测试
        run: npm test

      - name: 构建界面
        run: npm run build

      - name: 打包
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # 没有签名证书：不去钥匙串里找证书（macOS 按 package.json 做 ad-hoc 签名）
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 准备虚拟显示（Linux）
        if: runner.os == 'Linux'
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: 冒烟测试：启动打包好的程序，加载全部参数目录后自动退出
        shell: bash
        timeout-minutes: 5
        env:
          CCM_SELFTEST: '1'
          CC_CX_MANAGER_HOME: ${{ runner.temp }}/ccm-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/ccm-claude
          CODEX_HOME: ${{ runner.temp }}/ccm-codex
        run: |
          case "$RUNNER_OS" in
            Windows)
              cmd=("release/win-unpacked/CC-CX Manager.exe") ;;
            macOS)
              app=$(find release -maxdepth 2 -name 'CC-CX Manager.app' -not -path '*temp*' | head -1)
              cmd=("$app/Contents/MacOS/CC-CX Manager") ;;
            Linux)
              cmd=(xvfb-run -a release/linux-unpacked/cc-cx-manager --no-sandbox) ;;
          esac
          out=$("${cmd[@]}" 2>&1 || true)
          line=$(printf '%s\n' "$out" | grep '^CCM_SELFTEST' | head -1 || true)
          if [ -z "$line" ]; then
            printf '%s\n' "$out" | tail -40
            echo "程序没有输出自检结果"
            exit 1
          fi
          node -e '
            const line = process.argv[1];
            if (!line.startsWith("CCM_SELFTEST {")) { console.error(line); process.exit(1); }
            const j = JSON.parse(line.slice("CCM_SELFTEST ".length));
            const bad = Object.entries(j.catalogs || {}).filter(([, c]) => c.error || c.untranslated || c.overlayErrors);
            if (!j.state || !j.desktop || !j.rendered || bad.length) {
              console.error("自检失败：" + JSON.stringify(j));
              process.exit(1);
            }
            console.log("自检通过：" + j.platform + "，参数目录 " + Object.keys(j.catalogs).join("、"));
          ' "$line"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: cc-cx-manager-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
